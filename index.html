<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#15130f" />

    <!-- Preconnect para performance de carregamento de fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- SEO primário -->
    <title>Glam Boutique | Moda autêntica e elegância em Guarabira - PB</title>
    <meta
      name="description"
      content="Glam Boutique — moda feminina, masculina e infantil com curadoria exclusiva. Frete grátis, troca fácil e pagamento seguro. Loja física em Guarabira, PB e e-commerce para todo o Brasil."
    />
    <meta name="keywords" content="moda, roupas, e-commerce, boutique, Guarabira, Paraíba, vestidos, moda feminina, moda masculina" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.glamboutique.com.br/" />

    <!-- Open Graph / redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glam Boutique" />
    <meta property="og:title" content="Glam Boutique | Moda autêntica e elegância" />
    <meta
      property="og:description"
      content="Curadoria exclusiva de roupas e acessórios. Frete grátis acima de R$ 299, troca fácil e pagamento 100% seguro."
    />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://www.glamboutique.com.br/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Glam Boutique | Moda autêntica e elegância" />
    <meta
      name="twitter:description"
      content="Curadoria exclusiva de roupas e acessórios, com frete grátis e troca fácil."
    />

    <!-- Dados estruturados da loja física (Local Business / SEO local) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "Glam Boutique",
        "image": "https://www.glamboutique.com.br/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rua Quinze de Novembro, 100, Sala 100",
          "addressLocality": "Guarabira",
          "addressRegion": "PB",
          "postalCode": "58200-000",
          "addressCountry": "BR"
        },
        "url": "https://www.glamboutique.com.br/",
        "telephone": "+55 83 9999-0000"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
