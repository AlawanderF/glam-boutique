# ============================================================================
# Glam Boutique — Deploy automático no GitHub Pages
# ============================================================================
# Só dispara após CI passar (gate).
# ============================================================================

name: Deploy Glam Boutique → GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:gh-pages

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Healthcheck do build
        run: |
          test -f dist/index.html || (echo "❌ dist/index.html não encontrado" && exit 1)
          echo "✅ Build OK"

      - name: Upload dos artefatos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Healthcheck pós-deploy
        run: |
          echo "Site publicado em: ${{ steps.deployment.outputs.page_url }}"
          sleep 5
          curl -fsSL -o /dev/null -w "%{http_code}\n" "${{ steps.deployment.outputs.page_url }}" || echo "⚠️ healthcheck falhou"
